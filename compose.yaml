services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: ticket_db
    environment:
      POSTGRES_DB: 'ticket_db'
      POSTGRES_USER: 'app_user'
      POSTGRES_PASSWORD: 'app_password'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: